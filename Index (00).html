<style>
:root{
  --bg:#EEF2F9;--card:#fff;--ink:#0B1B3F;--muted:#5B6885;--line:#DBE2F0;--chip:#EEF2FA;
  --brand:#0B2A6B;--red:#E0303F;--redsoft:#FDECEE;--green:#0F9D6B;--greensoft:#E2F5EC;
  --amber:#9A6412;--ambersoft:#FFF3D6;--focus:#2F6BFF;--tk1:#0F3383;--tk2:#071A45;
  --display:'Bricolage Grotesque','Figtree',system-ui,sans-serif;
  --body:'Figtree',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  color-scheme:light;
}
[data-theme=dark]{
  --bg:#070D1C;--card:#0F1932;--ink:#E9EEFB;--muted:#8E9BC2;--line:#1E2C50;--chip:#15213F;
  --brand:#8FAEFF;--red:#FF5A68;--redsoft:#3A1520;--green:#2DD4A0;--greensoft:#0E2F2A;
  --amber:#F5C05A;--ambersoft:#33270F;--focus:#7FA2FF;--tk1:#18398F;--tk2:#0A1B4B;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.5 var(--body);transition:background .3s,color .3s;overflow-x:hidden}
h1,h2,h3{font-family:var(--display);margin:0;line-height:1.1;letter-spacing:-.02em}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:8px}
.i{width:1.15em;height:1.15em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none;vertical-align:-.2em}
.wrap{max-width:1040px;margin:0 auto;padding:0 16px}
.stripe{height:5px;background:linear-gradient(90deg,#0B2A6B 0 33.3%,#fff 33.3% 66.6%,#E0303F 66.6%)}
.status{display:flex;align-items:center;gap:8px;padding:10px 0 2px;font-size:13px;color:var(--muted);flex-wrap:wrap}
.status .dot{width:9px;height:9px;border-radius:50%;background:var(--red);box-shadow:0 0 0 0 var(--red);animation:ping 2.4s infinite}
@keyframes ping{0%{box-shadow:0 0 0 0 rgba(224,48,63,.5)}70%,100%{box-shadow:0 0 0 9px rgba(224,48,63,0)}}
.status b{color:var(--ink);font-weight:600}

/* header */
.hdr{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.hdr .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-top:10px;padding-bottom:10px}
.logo{display:flex;align-items:center;gap:10px;min-width:0}
.logo .mark{width:40px;height:40px;border-radius:12px;background:var(--red);display:grid;place-items:center;color:#fff;flex:none}
.logo .mark svg{width:22px;height:22px;fill:#fff}
.logo .t{font:700 20px/1 var(--display);letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.logo .s{display:block;font:500 12px/1.2 var(--body);color:var(--muted);letter-spacing:0;margin-top:3px}
.hdr .right{display:flex;align-items:center;gap:10px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 16px;border-radius:14px;font-weight:600;font-size:15px;background:var(--chip);border:1px solid var(--line);transition:transform .15s,background .2s}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--red);border-color:var(--red);color:#fff}
.btn.navy{background:var(--brand);border-color:var(--brand);color:#fff}
[data-theme=dark] .btn.navy{background:var(--card);border-color:var(--line);color:var(--ink)}
.btn.sm{padding:8px 12px;font-size:14px;border-radius:12px}
.btn.danger{color:var(--red)}
.btn[disabled]{opacity:.5;pointer-events:none}

/* theme switch: sol y luna */
.theme{position:relative;width:70px;height:38px;border-radius:99px;background:linear-gradient(180deg,#7EC8FF,#C4E6FF);border:1px solid rgba(11,27,63,.12);overflow:hidden;transition:background .4s;flex:none}
[data-theme=dark] .theme{background:linear-gradient(180deg,#0A1440,#1D2C74);border-color:rgba(255,255,255,.14)}
.theme .stars{position:absolute;inset:0;opacity:0;transition:opacity .4s;
  background:radial-gradient(1.3px 1.3px at 14px 10px,#fff,transparent),radial-gradient(1px 1px at 24px 24px,#cfe0ff,transparent),radial-gradient(1.2px 1.2px at 34px 12px,#fff,transparent),radial-gradient(1px 1px at 20px 15px,#fff,transparent)}
[data-theme=dark] .theme .stars{opacity:1}
.theme .cloud{position:absolute;right:9px;bottom:7px;width:20px;height:9px;border-radius:9px;background:#fff;opacity:.9;transition:opacity .3s}
.theme .cloud::before{content:"";position:absolute;left:4px;top:-5px;width:10px;height:10px;border-radius:50%;background:#fff}
[data-theme=dark] .theme .cloud{opacity:0}
.theme .knob{position:absolute;top:4px;left:4px;width:28px;height:28px;border-radius:50%;background:#FFD23F;box-shadow:0 0 0 4px rgba(255,210,63,.28);transition:transform .45s cubic-bezier(.5,1.5,.5,1),background .4s,box-shadow .4s}
[data-theme=dark] .theme .knob{transform:translateX(32px);background:#E7ECFF;box-shadow:0 0 0 4px rgba(200,212,255,.14)}
.theme svg{position:absolute;inset:4px;width:20px;height:20px;transition:transform .5s,opacity .3s}
.theme .sun{fill:#F59E0B;stroke:#F59E0B;stroke-width:1.8;stroke-linecap:round}
.theme .moon{fill:#4F63B8;stroke:none;opacity:0;transform:rotate(60deg) scale(.4)}
[data-theme=dark] .theme .sun{opacity:0;transform:rotate(-90deg) scale(.3)}
[data-theme=dark] .theme .moon{opacity:1;transform:none}

/* layout */
main{padding:14px 0 40px}
.grid{display:grid;gap:18px;margin-top:18px}
@media(min-width:880px){.grid.two{grid-template-columns:1.08fr .92fr;align-items:start}.grid.wide{grid-template-columns:1.35fr .65fr;align-items:start}}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:20px;transition:background .3s,border-color .3s}
.card h2{font-size:22px;display:flex;align-items:center;gap:10px}
.card h2 .ico{width:38px;height:38px;border-radius:11px;background:var(--redsoft);color:var(--red);display:grid;place-items:center;flex:none}
.sub{color:var(--muted);font-size:14px;margin-top:6px}
.empty{padding:28px 12px;text-align:center;color:var(--muted);font-size:14px}
.demo,.stale{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:14px;font-size:14px;margin-top:14px;background:var(--ambersoft);color:var(--amber);border:1px solid color-mix(in srgb,var(--amber) 30%,transparent)}
.notice{display:flex;gap:10px;align-items:flex-start;padding:14px 16px;border-radius:16px;margin-top:14px;font-size:15px;font-weight:500;background:var(--chip);border:1px solid var(--line)}
.notice.warn{background:var(--ambersoft);color:var(--amber);border-color:color-mix(in srgb,var(--amber) 35%,transparent)}
.notice.info{background:color-mix(in srgb,var(--brand) 9%,var(--card));color:var(--ink)}

/* ticket */
.ticket{position:relative;border-radius:30px;color:#fff;background:linear-gradient(155deg,var(--tk1),var(--tk2));border:1px solid rgba(255,255,255,.08)}
.tk-top{padding:24px 22px 18px}
.tk-head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.tk-date{font-size:14px;color:rgba(255,255,255,.72);font-weight:500}
.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 11px;border-radius:99px;font-size:12.5px;font-weight:700;background:rgba(255,255,255,.14)}
.pill.up{background:var(--red);color:#fff}.pill.down{background:#12B57F;color:#04261b}.pill.warn{background:#FFD76A;color:#5b3a00}
.tk-num{display:flex;align-items:baseline;gap:10px;margin-top:14px;font-family:var(--display);font-weight:800;letter-spacing:-.045em;font-variant-numeric:tabular-nums}
.tk-num #bigNum{font-size:clamp(88px,26vw,132px);line-height:.9}
.tk-num .cur{font-size:26px;font-weight:700;letter-spacing:0;color:rgba(255,255,255,.7)}
.tk-sub{margin-top:8px;color:rgba(255,255,255,.75);font-size:15px}
.tk-chg{display:inline-flex;align-items:center;gap:8px;margin-top:14px;padding:8px 14px;border-radius:14px;font-weight:700;font-size:15px;background:rgba(255,255,255,.12)}
.tk-chg.up{background:var(--red)}.tk-chg.down{background:#12B57F;color:#04261b}
.tk-chg small{font-weight:600;opacity:.85;font-size:13px}
.tk-spark{display:block;width:100%;height:64px;margin-top:16px}
.tk-note{margin-top:14px;padding:12px 14px;border-left:3px solid var(--red);background:rgba(255,255,255,.08);border-radius:0 12px 12px 0;font-size:14.5px;color:rgba(255,255,255,.92)}
.tk-perf{position:relative;height:0;border-top:2px dashed rgba(255,255,255,.22);margin:0 22px}
.tk-perf::before,.tk-perf::after{content:"";position:absolute;top:-14px;width:26px;height:26px;border-radius:50%;background:var(--bg);transition:background .3s}
.tk-perf::before{left:-35px}.tk-perf::after{right:-35px}
.tk-stub{display:grid;grid-template-columns:1fr 1fr;gap:16px 10px;padding:20px 22px 22px}
@media(min-width:520px){.tk-stub{grid-template-columns:repeat(4,1fr)}}
.tk-stub b{display:block;font:700 22px/1.1 var(--display);font-variant-numeric:tabular-nums}
.tk-stub span{display:block;font-size:12.5px;color:rgba(255,255,255,.65);margin-top:4px}
.tk-stub .up{color:#FF8A94}.tk-stub .down{color:#5CE3B4}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.actions .btn{flex:1 1 calc(50% - 8px);min-width:140px}
@media(min-width:520px){.actions .btn{flex:1 1 0}}

/* calculator */
.lbl{display:block;font-size:13px;font-weight:600;color:var(--muted);margin:18px 0 8px}
.fld{display:flex;align-items:center;gap:10px;background:var(--chip);border:1.5px solid var(--line);border-radius:16px;padding:0 16px;transition:border-color .2s,background .2s}
.fld:focus-within{border-color:var(--focus)}
.fld input{flex:1;min-width:0;border:0;background:none;outline:0;font:700 28px/1 var(--display);padding:17px 0;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.fld span{font-weight:700;font-size:13px;color:var(--muted)}
.fld.out{background:var(--redsoft);border-color:color-mix(in srgb,var(--red) 30%,transparent)}
.fld.out input,.fld.out span{color:var(--red)}
.link{display:flex;align-items:center;justify-content:center;gap:10px;margin:14px 0 -6px;flex-wrap:wrap}
.rate-pill{display:inline-flex;align-items:center;gap:6px;padding:6px 14px;border-radius:99px;background:var(--redsoft);color:var(--red);font-weight:700;font-size:14px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.chip{padding:7px 14px;border-radius:99px;background:var(--chip);border:1px solid var(--line);font-weight:600;font-size:14px}
.chip:active{transform:scale(.96)}
.result{margin-top:16px;padding:14px 16px;border-radius:16px;background:var(--chip);display:flex;justify-content:space-between;align-items:center;gap:12px}
.result p{font-size:14px;color:var(--muted)}
.result b{display:block;color:var(--ink);font:700 18px/1.3 var(--display)}
.custom{margin-top:14px;font-size:14px;color:var(--muted);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.custom input[type=text]{width:100px;padding:8px 10px;border-radius:10px;border:1.5px solid var(--line);background:var(--chip)}

/* chart */
.tabs{display:inline-flex;background:var(--chip);border-radius:14px;padding:4px;gap:2px;margin-top:16px;max-width:100%;overflow-x:auto}
.tabs button{padding:8px 14px;border-radius:11px;font-weight:600;font-size:14px;color:var(--muted);white-space:nowrap}
.tabs button[aria-selected=true]{background:var(--card);color:var(--ink);box-shadow:0 1px 0 var(--line)}
.chart{position:relative;margin-top:14px;min-height:220px}
.chart svg{display:block;touch-action:pan-y;user-select:none}
.gl{stroke:var(--line);stroke-width:1;stroke-dasharray:3 5}
.gt{fill:var(--muted);font:500 11.5px var(--body)}
.tip{position:absolute;top:0;pointer-events:none;padding:8px 11px;border-radius:12px;background:var(--ink);color:var(--bg);font-size:13px;line-height:1.3;white-space:nowrap;opacity:0;transition:opacity .12s;transform:translateX(-50%)}
.tip b{display:block;font:700 16px var(--display)}
.chart-sum{margin-top:8px;font-size:14px;color:var(--muted)}
.chart-sum b{color:var(--ink)}

/* other rates */
.rates{display:grid;gap:10px;margin-top:16px}
.rate{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 14px;border-radius:16px;background:var(--chip)}
.rate .n{font-weight:600}.rate .n small{display:block;color:var(--muted);font-weight:500;font-size:12.5px}
.rate .v{font:700 20px var(--display);text-align:right;font-variant-numeric:tabular-nums}
.delta{font:600 12.5px var(--body);display:block}
.delta.up{color:var(--red)}.delta.down{color:var(--green)}.delta.flat{color:var(--muted)}

/* history */
.hist{margin-top:14px}
.hrow{display:grid;grid-template-columns:78px 1fr auto;gap:10px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.hrow:first-child{border-top:0}
.hrow .d{font-size:14px;color:var(--muted);font-weight:500}
.hrow .v{font:700 18px var(--display);font-variant-numeric:tabular-nums}
.hrow .nt{grid-column:2/4;font-size:13px;color:var(--muted);margin-top:-6px}

/* channels / faq */
.chan{display:grid;gap:10px;margin-top:14px}
.chan a{display:flex;align-items:center;gap:12px;padding:14px;border-radius:16px;font-weight:600;background:var(--chip);text-decoration:none;color:inherit;border:1px solid var(--line)}
.chan a svg{width:22px;height:22px}
.faq details{border-top:1px solid var(--line)}
.faq details:first-of-type{border-top:0;margin-top:8px}
.faq summary{list-style:none;cursor:pointer;padding:15px 0;font-weight:600;display:flex;justify-content:space-between;gap:12px;align-items:center}
.faq summary::-webkit-details-marker{display:none}
.faq summary .i{transition:transform .25s;color:var(--muted)}
.faq details[open] summary .i{transform:rotate(180deg)}
.faq details p{padding:0 0 16px;color:var(--muted);font-size:15px}
footer{padding:26px 0 40px;color:var(--muted);font-size:13.5px}
footer .row{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}
footer a{color:inherit}
.disc{max-width:60ch}

/* toast */
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translate(-50%,30px);opacity:0;z-index:100;background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:14px;font-weight:600;font-size:14.5px;max-width:min(92vw,440px);text-align:center;transition:.25s;pointer-events:none}
#toast.on{opacity:1;transform:translate(-50%,0)}
#toast.err{background:var(--red);color:#fff}

/* admin */
.back{position:fixed;inset:0;background:rgba(3,8,22,.6);z-index:40;opacity:0;pointer-events:none;transition:opacity .25s}
.back.on{opacity:1;pointer-events:auto}
.adm{position:fixed;z-index:41;inset:0;background:var(--bg);display:flex;flex-direction:column;transform:translateY(100%);visibility:hidden;transition:transform .35s cubic-bezier(.2,.8,.2,1),visibility .35s;padding-top:env(safe-area-inset-top)}
.adm.on{transform:none;visibility:visible}
@media(min-width:900px){.adm{inset:4vh 50% 4vh auto;left:auto;right:calc(50% - 450px);width:900px;border-radius:26px;border:1px solid var(--line);overflow:hidden}}
.adm-h{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 18px;border-bottom:1px solid var(--line);background:var(--card)}
.adm-h h2{font-size:20px}.adm-h small{display:block;color:var(--muted);font:500 12.5px var(--body);margin-top:3px}
.adm-h small.on{color:var(--green)}
.adm-tabs{display:flex;gap:4px;padding:10px 14px;overflow-x:auto;border-bottom:1px solid var(--line);background:var(--card)}
.adm-tabs button{padding:9px 14px;border-radius:12px;font-weight:600;font-size:14.5px;color:var(--muted);white-space:nowrap;display:flex;align-items:center;gap:7px}
.adm-tabs button[aria-selected=true]{background:var(--brand);color:#fff}
[data-theme=dark] .adm-tabs button[aria-selected=true]{background:var(--chip);color:var(--ink)}
.adm-b{flex:1;overflow:auto;padding:18px 16px calc(28px + env(safe-area-inset-bottom));-webkit-overflow-scrolling:touch}
.box{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;margin-bottom:14px}
.box h3{font-size:18px;margin-bottom:4px}
.box label,.login label{display:block;font-size:13px;font-weight:600;color:var(--muted);margin-top:14px}
.box input[type=text],.box input[type=date],.box input[type=url],.box textarea,.box select,.login input{display:block;width:100%;margin-top:6px;padding:12px 14px;border-radius:13px;border:1.5px solid var(--line);background:var(--chip);color:var(--ink);font-size:16px}
.box textarea{min-height:84px;resize:vertical}
.valbox{display:grid;grid-template-columns:auto 1fr auto;gap:8px;margin-top:8px;align-items:stretch}
.valbox .st{display:flex;flex-direction:column;gap:6px}
.valbox input{font:800 36px/1 var(--display)!important;text-align:center;margin-top:0!important;letter-spacing:-.03em}
.valbox button{padding:8px 10px;border-radius:11px;background:var(--chip);border:1px solid var(--line);font-weight:700;font-size:14px;font-variant-numeric:tabular-nums;min-width:62px}
.prev{margin-top:12px;padding:12px 14px;border-radius:14px;background:var(--chip);font-size:14px;color:var(--muted)}
.prev b.up{color:var(--red)}.prev b.down{color:var(--green)}
.row2{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
.row2 .btn{flex:1 1 auto}
.login{max-width:380px;margin:6vh auto 0;padding:26px;background:var(--card);border:1px solid var(--line);border-radius:22px}
.login .lock{width:48px;height:48px;border-radius:14px;background:var(--redsoft);color:var(--red);display:grid;place-items:center;margin-bottom:14px}
.login h2{font-size:24px}.login .btn{width:100%;margin-top:18px}
.err{color:var(--red);font-size:14px;min-height:20px;margin-top:10px}
.list .li{display:grid;grid-template-columns:82px 1fr auto;gap:10px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.list .li:first-child{border-top:0}
.li .d{font-size:13.5px;color:var(--muted)}.li .v{font:700 18px var(--display)}.li .ntonst oferta = cache.ofertas.find(o=>o.id===r.oferta_id);
    const titulo = oferta ? oferta.titulo : 'Oferta';

    return `

let currentMsgs = [];
function renderChatThread(){

        <div style="font-size:12px;color:var(--text-muted);">${esc(oferta?oferta.titulo:'Oferta')} · ${labelStatus(r.estado)}</div>
      </div>

    ${perfil.rol==='admin' ? `<div class="ok-box" style="margin-top:12px;">Recargar al <strong>${esc(r.numero_telefono||'—')}</strong> · Paga con <strong>${esc(r.metodo_pago||'—')}</strong></div>` : ''}

    <div class="chat-input-row">

      <input id="chat-input" placeholder="Escribe un mensaje...">
      <button id="chat-send">Enviar</button>
    </div>` : `<div class="empty" style="padding:14px 0;">Esta venta ya se completó. El chat quedó cerrado.</div>`}
    ${perfil.rol==='admin' && r.estado==='aprobada' ? `<button class="primary" id="mark-complete">Marcar venta como completada</button>` : ''}

function renderMsgBubble(m){
  const mine = m.remitente_id===session.user.id;
  if(m.tipo==='imagen' && m.archivo_url){
    return `<div class="msg ${mine?'mine':'theirs'}"><img src="${esc(m.archivo_url)}" alt="Foto enviada"></div>`;
  }
  return `<div class="msg ${mine?'mine':'theirs'}">${esc(m.texto)}</div>`;
}
async function loadAndRenderMsgs(reqId){
  const { data } = await sb.from('mensajes').select('*').eq('solicitud_id', reqId).order('creado_en', {ascending:true});
  currentMsgs = data || [];
  const box = document.getElementById('chat-msgs');
  if(!box) return;
  box.innerHTML = currentMsgs.length ? currentMsgs.map(renderMsgBubble).join('') : '<div class="empty">Escribe el primer mensaje.</div>';
  box.scrollTop = box.scrollHeight;
}
function subscribeChat(reqId){
  if(chatChannel) sb.removeChannel(chatChannel);
  chatChannel = sb.channel('chat-'+reqId)
    .on('postgres_changes', {event:'INSERT', schema:'public', table:'mensajes', filter:`solicitud_id=eq.${reqId}`}, payload=>{
      if(currentMsgs.some(m=>m.id===payload.new.id)) return;
      currentMsgs.push(payload.new);
      const box = document.getElementById('chat-msgs');
      if(box){
        box.innerHTML = currentMsgs.map(renderMsgBubble).join('');
        box.scrollTop = box.scrollHeight;
      }
    })
    .on('postgres_changes', {event:'UPDATE', schema:'public', table:'solicitudes', filter:`id=eq.${reqId}`}, payload=>{
      const idx = cache.solicitudes.findIndex(s=>s.id===reqId);
      if(idx>-1) cache.solicitudes[idx] = Object.assign({}, cache.solicitudes[idx], payload.new);
      if(view.activeRequestId===reqId && view.tab==='chat') render();
    }).subscribe();
}
async function uploadChatFoto(reqId, file){
  const ext = (file.name.split('.').pop()||'jpg').toLowerCase();
  const path = `${reqId}/${Date.now()}-${Math.random().toString(36).slice(2)}.${ext}`;
  const { error } = await sb.storage.from('chat-fotos').upload(path, file);
  if(error) throw error;
  const { data } = sb.storage.from('chat-fotos').getPublicUrl(path);
  return data.publicUrl;
}

/* ---------------- EVENTS ---------------- */
function attachAppEvents(){
  document.querySelectorAll('.bottom-nav [data-tab]').forEach(b=>b.onclick=()=>{ view.tab=b.dataset.tab; view.activeRequestId=null; render(); });

  document.querySelectorAll('[data-offer]').forEach(b=>b.onclick=()=>{
    openSolicitudModal(b.dataset.offer);
  });

  const addBtn = document.getElementById('add-oferta-btn');
  if(addBtn) addBtn.onclick = async ()=>{
    const errBox = document.getElementById('oferta-form-error');
    errBox.textContent = '';
    const titulo = document.getElementById('new-titulo').value.trim();
    const precio = document.getElementById('new-precio').value.trim();
    const precio_antes = document.getElementById('new-precio-antes').value.trim() || null;
    const descuento = document.getElementById('new-badge').value.trim() || null;
    const descripcion = document.getElementById('new-desc').value.trim();
    const fileInput = document.getElementById('new-imagen');
    const file = fileInput.files[0];
    if(!titulo || !precio){ errBox.textContent='Completa al menos título y precio.'; return; }
    addBtn.disabled = true; addBtn.textContent = 'Guardando...';
    try{
      let imagen_url;
      if(file) imagen_url = await uploadOfertaImagen(file);
      const payload = { titulo, precio, precio_antes, descuento, descripcion };
      if(imagen_url) payload.imagen_url = imagen_url;
      if(view.editingOfertaId){
        const { error } = await sb.from('ofertas').update(payload).eq('id', view.editingOfertaId);
        if(error) throw error;
        view.editingOfertaId = null;
      } else {
        const { error } = await sb.from('ofertas').insert(payload);
        if(error) throw error;
      }
      await loadOfertas(); render();
    }catch(e){
      addBtn.disabled = false; addBtn.textContent = view.editingOfertaId ? 'Guardar cambios' : 'Publicar oferta';
      errBox.textContent = 'Error: ' + e.message;
    }
  };
  document.querySelectorAll('[data-edit-oferta]').forEach(b=>b.onclick=()=>{
    view.editingOfertaId = b.dataset.editOferta; render();
  });
  const cancelEdit = document.getElementById('cancel-edit-oferta');
  if(cancelEdit) cancelEdit.onclick = ()=>{ view.editingOfertaId = null; render(); };
  document.querySelectorAll('[data-remove-oferta]').forEach(b=>b.onclick=async ()=>{
    if(!confirm('¿Quitar esta oferta?')) return;
    b.disabled = true; b.textContent = 'Quitando...';
    const { data:{ session: freshSession } } = await sb.auth.getSession();
    const { error } = await sb.from('ofertas').update({activa:false}).eq('id', b.dataset.removeOferta);
    if(error){
      let tokenInfo = 'sin sesión';
      try{
        const payload = JSON.parse(atob(freshSession.access_token.split('.')[1]));
        tokenInfo = 'sub: '+payload.sub+' | role: '+payload.role;
      }catch(e){}
      alert('ERROR COMPLETO:\n' + JSON.stringify(error, null, 2) + '\n\nSESIÓN USADA:\n' + tokenInfo);
      b.disabled=false; b.textContent='Quitar'; return;
    }
    await loadOfertas(); render();
  });

  document.querySelectorAll('[data-review]').forEach(b=>b.onclick=()=>openReviewModal(b.dataset.review));

  document.querySelectorAll('[data-open]').forEach(b=>b.onclick=async ()=>{
    view.activeRequestId = b.dataset.open; render();
    setTimeout(async ()=>{ await loadAndRenderMsgs(view.activeRequestId); subscribeChat(view.activeRequestId); }, 50);
  });
  const back = document.getElementById('chat-back');
  if(back) back.onclick = ()=>{ view.activeRequestId=null; if(chatChannel) sb.removeChannel(chatChannel); render(); };

  const profileTrigger = document.getElementById('chat-profile-trigger');
  if(profileTrigger) profileTrigger.onclick = ()=>{
    const r = cache.solicitudes.find(x=>x.id===view.activeRequestId);
    if(perfil.rol==='cliente') openAdminProfileModal();
    else openClienteProfileModal(r);
  };

  if(view.activeRequestId){ loadAndRenderMsgs(view.activeRequestId); subscribeChat(view.activeRequestId); }

  const sendBtn = document.getElementById('chat-send');
  if(sendBtn) sendBtn.onclick = async ()=>{
    const input = document.getElementById('chat-input');
    const text = input.value.trim();
    if(!text) return;
    input.value='';
    const { data, error } = await sb.from('mensajes')
      .insert({ solicitud_id: view.activeRequestId, remitente_id: session.user.id, texto: text, tipo:'texto' })
      .select().single();
    if(error){ alert('No se pudo enviar: '+error.message); return; }
    if(data && !currentMsgs.some(m=>m.id===data.id)){
      currentMsgs.push(data);
      const box = document.getElementById('chat-msgs');
      if(box){
        box.innerHTML = currentMsgs.map(renderMsgBubble).join('');
        box.scrollTop = box.scrollHeight;
      }
    }
  };

  const metodosBtn = document.getElementById('chat-metodos-btn');
  if(metodosBtn) metodosBtn.onclick = ()=>{
    if(!cache.metodosPago.length){ alert('Aún no has agregado métodos de pago. Ve a Perfil para agregarlos.'); return; }
    const overlay = document.createElement('div');
    overlay.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,0.6);display:flex;align-items:flex-end;z-index:50;';
    overlay.innerHTML = `
      <div style="background:var(--surface);width:100%;max-width:480px;margin:0 auto;border-radius:18px 18px 0 0;padding:22px;border:1px solid var(--border);border-bottom:none;">
        <h3 class="serif" style="margin-top:0;">Elige un método para compartir</h3>
        ${cache.metodosPago.map(m=>`
          <div class="req-row" data-pick-metodo="${m.id}" style="cursor:pointer;">
            <div class="info"><div class="name">${esc(m.nombre)}</div><div class="sub">${esc(m.detalle)}</div></div>
          </div>`).join('')}
        <button class="ghost" id="cancel-metodo-pick">Cancelar</button>
      </div>`;
    document.body.appendChild(overlay);
    overlay.querySelector('#cancel-metodo-pick').onclick = ()=>overlay.remove();
    overlay.querySelectorAll('[data-pick-metodo]').forEach(row=>row.onclick=()=>{
      const m = cache.metodosPago.find(x=>x.id===row.dataset.pickMetodo);
      const input = document.getElementById('chat-input');
      if(input) input.value = `Puedes pagar por ${m.nombre}: ${m.detalle}`;
      overlay.remove();
    });
  };
  const photoBtn = document.getElementById('chat-photo-btn');
  const photoInput = document.getElementById('chat-photo-input');
  if(photoBtn && photoInput) photoBtn.onclick = ()=> photoInput.click();
  if(photoInput) photoInput.onchange = async ()=>{
    const file = photoInput.files[0];
    if(!file) return;
    photoBtn.disabled = true; photoBtn.textContent = '⏳';
    try{
      const url = await uploadChatFoto(view.activeRequestId, file);
      const { data, error } = await sb.from('mensajes')
        .insert({ solicitud_id: view.activeRequestId, remitente_id: session.user.id, texto:'', tipo:'imagen', archivo_url:url })
        .select().single();
      if(error) throw error;
      if(data && !currentMsgs.some(m=>m.id===data.id)){
        currentMsgs.push(data);
        const box = document.getElementById('chat-msgs');
        if(box){
          box.innerHTML = currentMsgs.map(renderMsgBubble).join('');
          box.scrollTop = box.scrollHeight;
        }
      }
    }catch(e){
      alert('No se pudo enviar la foto: '+e.message);
    }
    photoBtn.disabled = false; photoBtn.textContent = '📷';
    photoInput.value = '';
  };

  const markComplete = document.getElementById('mark-complete');
  if(markComplete) markComplete.onclick = async ()=>{
    await sb.from('solicitudes').update({estado:'completada'}).eq('id', view.activeRequestId);
    render();
  };

  document.querySelectorAll('[data-approve]').forEach(b=>b.onclick=async ()=>{
    await sb.from('solicitudes').update({estado:'aprobada'}).eq('id', b.dataset.approve);
    render();
  });
  document.querySelectorAll('[data-reject]').forEach(b=>b.onclick=async ()=>{
    await sb.from('solicitudes').update({estado:'rechazada'}).eq('id', b.dataset.reject);
    render();
  });

  const addMetodoBtn = document.getElementById('add-metodo-btn');
  if(addMetodoBtn) addMetodoBtn.onclick = async ()=>{
    const errBox = document.getElementById('metodo-error');
    const nombre = document.getElementById('new-metodo-nombre').value.trim();
    const detalle = document.getElementById('new-metodo-detalle').value.trim();
    if(!nombre || !detalle){ errBox.textContent='Completa ambos campos.'; return; }
    addMetodoBtn.disabled = true; addMetodoBtn.textContent = 'Guardando...';
    const { error } = await sb.from('metodos_pago').insert({ nombre, detalle });
    addMetodoBtn.disabled = false; addMetodoBtn.textContent = 'Agregar método de pago';
    if(error){ errBox.textContent = 'Error: '+error.message; return; }
    await loadMetodosPago(); render();
  };
  document.querySelectorAll('[data-remove-metodo]').forEach(b=>b.onclick=async ()=>{
    if(!confirm('¿Quitar este método de pago?')) return;
    await sb.from('metodos_pago').update({activo:false}).eq('id', b.dataset.removeMetodo);
    await loadMetodosPago(); render();
  });

  const logout = document.getElementById('logout-btn');
  if(logout) logout.onclick = async ()=>{ await sb.auth.signOut(); session=null; perfil=null; render(); };
}

    <div style="background:var(--surface);width:100%;max-width:480px;margin:0 auto;border-radius:18px 18px 0 0;padding:22px;border:1px solid var(--border);border-bottom:none;">
      <h3 class="serif" style="margin-top:0;">${esc(r?.perfiles?.nombre||'Cliente')}</h3>
      <p class="muted">Número a recargar: ${esc(r?.numero_telefono||'—')}</p>
      <p class="muted">Método de pago elegido: ${esc(r?.metodo_pago||'—')}</p>
      <button class="ghost" id="close-profile-modal">Cerrar</button>
    </div>`;
  document.body.appendChild(overlay);
  overlay.querySelector('#close-profile-modal').onclick = ()=>overlay.remove();
  overlay.onclick = (e)=>{ if(e.target===overlay) overlay.remove(); };
}
function openReviewModal(reqId){
  const overlay = document.createElement('div');
  overlay.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,0.6);display:flex;align-items:flex-end;z-index:50;';
  overlay.innerHTML = `
    <div style="background:var(--surface);width:100%;max-width:480px;margin:0 auto;border-radius:18px 18px 0 0;padding:22px;border:1px solid var(--border);border-bottom:none;">
      <h3 class="serif" style="margin-top:0;">Deja tu reseña</h3>
      <div class="star-picker" id="star-picker">${[1,2,3,4,5].map(n=>`<span data-star="${n}">★</span>`).join('')}</div>
      <textarea id="review-comment" rows="3" placeholder="¿Cómo fue tu experiencia? (opcional)" style="margin-top:14px;"></textarea>
      <button class="primary" id="submit-review">Enviar reseña</button>
      <button class="ghost" id="cancel-review">Cancelar</button>
    </div>`;
  document.body.appendChild(overlay);
  let rating = 0;
  overlay.querySelectorAll('[data-star]').forEach(s=>s.onclick=()=>{
    rating = parseInt(s.dataset.star);
    overlay.querySelectorAll('[data-star]').forEach(x=>x.classList.toggle('on', parseInt(x.dataset.star)<=rating));
  });
  overlay.querySelector('#cancel-review').onclick = ()=>overlay.remove();
  overlay.querySelector('#submit-review').onclick = async ()=>{
    if(!rating) return;
    const comentario = overlay.querySelector('#review-comment').value.trim();
    const { error } = await sb.from('resenas').insert({ solicitud_id: reqId, usuario_id: session.user.id, calificacion: rating, comentario });
    if(error){ alert('No se pudo enviar la reseña: '+error.message); return; }
    overlay.remove(); render();
  };
}

init();
</script>
</body>
</html>
